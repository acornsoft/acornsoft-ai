# Production deploy for www.acornsoft.ai — no Vercel CLI login.
# One-time in GitHub (acornsoft/acornsoft-ai → Settings → Secrets):
#   VERCEL_TOKEN      from https://vercel.com/account/tokens
#   VERCEL_ORG_ID     from the Vercel project Settings → General
#   VERCEL_PROJECT_ID from the same page
# Then: Actions → Deploy www.acornsoft.ai → Run workflow
name: Deploy www.acornsoft.ai

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Require Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as GitHub Actions secrets."
            exit 1
          fi
      - run: npm ci
      - run: npx vercel pull --yes --environment=production
      - run: npx vercel build --prod
      - run: npx vercel deploy --prebuilt --prod
