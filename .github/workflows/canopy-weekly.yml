# Weekly Canopy Radar pull — same GitHub repo Grok Build and Grok Bots use.
# Writes public/canopy/live-feed.json so the site can deploy a durable feed.
# main is protected, so this job pushes branch canopy/live-feed and opens a pull request.
#
# GitHub secrets (acornsoft/acornsoft-ai → Settings → Secrets → Actions):
#   X_BEARER_TOKEN  App-only Bearer from developer.x.com
name: Canopy weekly Radar

on:
  schedule:
    # Monday 13:00 UTC = 09:00 America/New_York (EDT)
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the 7-day window"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: canopy-weekly
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pull X into live-feed.json
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "Add X_BEARER_TOKEN as a GitHub Actions secret on acornsoft/acornsoft-ai."
            exit 1
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            node scripts/fetch-canopy-feed.mjs --force
          else
            node scripts/fetch-canopy-feed.mjs
          fi
      - name: Open a pull request for the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "acornsoft-bot"
          git config user.email "acornsoft@users.noreply.github.com"
          git add public/canopy/live-feed.json
          if git diff --cached --quiet; then
            echo "No feed change (window closed or identical pull)."
            exit 0
          fi
          git commit -m "Canopy weekly Radar pull"
          git push --force origin HEAD:canopy/live-feed
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head canopy/live-feed --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Updated pull request #$existing"
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head canopy/live-feed \
            --title "Canopy weekly Radar pull" \
            --body "Weekly live feed for /canopy. The site reads public/canopy/live-feed.json."
