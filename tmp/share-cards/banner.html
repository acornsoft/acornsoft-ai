<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../share-fonts/fonts.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1500px; height: 500px; overflow: hidden; background: #120806; }
      .card {
        width: 1500px;
        height: 500px;
        position: relative;
        background:
          radial-gradient(ellipse 70% 80% at 78% 20%, rgba(128, 0, 32, 0.5), transparent 55%),
          linear-gradient(180deg, #2a0c0c 0%, #120806 100%);
        font-family: "Source Sans 3", "Liberation Sans", sans-serif;
        color: #f4efe6;
      }
      svg.mountains {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 1500px;
        height: 220px;
      }
      .copy {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 56px 72px 48px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .brand img {
        height: 36px;
        width: auto;
        filter: brightness(1.4) saturate(1.15);
        margin-bottom: 28px;
      }
      .lede {
        font-family: "Source Serif 4", "Liberation Serif", Georgia, serif;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #fff8ee;
        margin: 0 0 12px;
      }
      .moves {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #ffcc66;
      }
    </style>
  </head>
  <body>
    <article class="card">
      <svg class="mountains" viewBox="0 0 1500 220" aria-hidden="true">
        <path fill="#2a1010" d="M0 220 V130 L160 108 L300 142 L480 58 L680 124 L880 78 L1080 130 L1280 70 L1500 118 V220 Z" />
        <path fill="#1a0a0a" d="M0 220 V158 L200 136 L380 164 L620 108 L860 154 L1120 118 L1360 156 L1500 132 V220 Z" />
        <path fill="none" stroke="#ffcc66" stroke-width="2" stroke-linecap="round" d="M0 168 L180 148 L340 162 L520 118 L740 150 L960 122 L1180 148 L1380 120 L1500 142" opacity="0.85" />
        <circle cx="480" cy="58" r="4" fill="#ffcc66" />
      </svg>
      <div class="copy">
        <div class="brand"><img src="./logo.png" alt="Acornsoft" /></div>
        <p class="lede">Write down what’s stuck.</p>
        <p class="moves">Base Camp · Route · Waypoint · Summit</p>
      </div>
    </article>
  </body>
</html>
